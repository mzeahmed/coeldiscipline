# After each pull request is merged into main, merge main back into develop
# to keep develop up to date (e.g. a hotfix merged directly into main).
# Fail if a conflict occurs: the merge must then be resolved manually,
# and nothing is pushed.
name: Sync develop

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# contents: write allows pushing the merge commit to develop.
permissions:
  contents: write

# Run only one synchronization at a time to prevent consecutive
# merged PRs from pushing to develop concurrently.
concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into develop
    # Only run for merged PRs, not PRs closed without merging.
    # After a develop → main PR, only the merge (or squash) commit
    # from main is merged back. Nothing to do if develop already contains it.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          # Full history is required to merge main.
          fetch-depth: 0

      - name: Merge main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main: nothing to do."
            exit 0
          fi

          if ! git merge --no-ff origin/main -m "chore: sync main into develop (PR #${{ github.event.pull_request.number }})"; then
            echo "::error::Conflict while merging main into develop: manual resolution required."
            git merge --abort
            exit 1
          fi

          git push origin develop
          